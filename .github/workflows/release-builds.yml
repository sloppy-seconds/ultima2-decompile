name: release-builds

# Player-facing binaries, built when a release tag (v*) is pushed.
#
# This workflow replays, on runners, exactly what deploy/linuxbuild and
# deploy/winbuild do on the dev box: build SDL3 from the pinned official
# tarball (static, same flags in all three places — keep SDL3_VERSION below in
# step with both Containerfiles), then link the engine against it. The
# containers stay the local path; CI is the reproducible one.
#
# The binaries carry the game's text compiled in, from the committed
# content/gen_content.h — that is the ruling in AGENTS.md § 0 ("The text/art
# line"), and it is why a release build must never fall back to regenerating that
# header from asm/ (38 strings would go empty and the character-creation screen
# would ship blank). Art is different and is substituted: the engine ships the
# cleanroom tile art compiled in, and the player supplies their own copy of the
# game data (docs/cleanroom-procedure.md is the legal record; the same § 0 is why
# the artifacts are binaries only, never a data pack).
#
# macOS is deliberately absent: the owner deferred it to a future macos-latest
# job (Apple SDK cannot be redistributed, so it cannot be cross-built here).
# See docs/phase4-state.md and the engine README.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  SDL3_VERSION: "3.4.18"   # keep in step with deploy/linuxbuild + deploy/winbuild

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: linux-static
            sdl_flags: ""
            make_target: sdl-static
            artifact: u2-sdl-static
          - name: windows-cross
            sdl_flags: >-
              -DCMAKE_SYSTEM_NAME=Windows
              -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
              -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
            make_target: sdl-win
            artifact: u2-sdl.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.name }}" = windows-cross ]; then
            sudo apt-get install -y mingw-w64
          else
            # SDL's cmake compiles out any video/audio backend whose headers are
            # missing, and says nothing when it does. Without these the static
            # SDL3 contains only dummy and offscreen: a player binary that links
            # cleanly, passes the static-link check, and cannot open a window on
            # any desktop. The gate below is what stops that shipping again.
            sudo apt-get install -y \
              libx11-dev libxext-dev libxfixes-dev libxcursor-dev libxi-dev \
              libxinerama-dev libxrandr-dev libxxf86vm-dev libxss-dev libxcb1-dev \
              libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
              libgl1-mesa-dev libasound2-dev libpulse-dev libgbm-dev libxtst-dev
          fi

      - name: Cache SDL3 ${{ env.SDL3_VERSION }} (${{ matrix.name }})
        uses: actions/cache@v4
        id: sdlcache
        with:
          path: sdl3-${{ matrix.name }}
          key: sdl3-${{ matrix.name }}-${{ env.SDL3_VERSION }}-v1

      - name: Build static SDL3
        if: steps.sdlcache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o SDL3.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz"
          tar -xzf SDL3.tar.gz
          cmake -S "SDL3-${SDL3_VERSION}" -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-${{ matrix.name }}" \
            -DBUILD_SHARED_LIBS=OFF -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            ${{ matrix.sdl_flags }}
          cmake --build sdl3-build
          cmake --install sdl3-build

      - name: Build the engine binary
        run: |
          # The tag goes into the binary, so a downloaded file can name its own
          # release. A report of "v0.0.7 doesn't work" is answerable when the
          # artifact can say which build it is; see docs/sdl2-vs-sdl3.md § 7.
          if [ "${{ matrix.name }}" = windows-cross ]; then
            PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/sdl3-windows-cross/lib/pkgconfig" \
              make -C engine ${{ matrix.make_target }} U2_VERSION="${{ github.ref_name }}"
          else
            make -C engine ${{ matrix.make_target }} \
              SDLSTAT_PREFIX="$GITHUB_WORKSPACE/sdl3-linux-static" \
              U2_VERSION="${{ github.ref_name }}"
          fi

      - name: Prove the link is really static
        run: |
          set -e
          if [ "${{ matrix.name }}" = windows-cross ]; then
            # the mingw-w64 metapackage already ships x86_64-w64-mingw32-objdump
            x86_64-w64-mingw32-objdump -p engine/u2-sdl.exe | grep "DLL Name" | tee imports.txt
            if grep -iE "SDL|libgcc|winpthread" imports.txt; then
              echo "FAIL: non-stock DLL import found"; exit 1
            fi
          else
            ldd engine/u2-sdl-static | tee deps.txt
            if grep -iE "sdl" deps.txt; then
              echo "FAIL: libsdl3 is dynamically linked"; exit 1
            fi
          fi

      # Ask the artifact what it can do, rather than trusting the build that made
      # it. A binary whose only video drivers are dummy/offscreen is unplayable on
      # a desktop and passes every other check here — which is exactly what shipped
      # once, because SDL's cmake compiles out a backend whose headers are missing
      # and says nothing. The cache key names the major version and starts at v1:
      # an SDL2 cache entry must never be reachable by an SDL3 build.
      - name: The Linux binary has a real display backend
        if: matrix.name == 'linux-static'
        run: |
          ./engine/u2-sdl-static --video-drivers | tee video-drivers.txt
          if ! grep -qx -e x11 -e wayland video-drivers.txt; then
            echo "FAIL: no x11 or wayland compiled in — this binary cannot open a window"; exit 1
          fi

      # The artifact must be able to say it is the artifact. If the stamp ever stops
      # reaching the compiler, or a dev-shaped build leaks into a release, this is
      # where it is caught — not in a bug report about a binary nobody can identify.
      #
      # The two platforms are checked differently, and the difference is honest about
      # why. The Linux binary runs natively here, so it is asked directly. The Windows
      # binary is not executed: a release must not depend on wine behaving on a
      # runner, and the first cut of this step did exactly that and blocked v0.0.8.
      # Instead the compiled-in stamp literals are looked for in the PE, which proves
      # the -D flags reached the compiler and the right target was built. It does not
      # prove the exe runs, and it does not claim to — that check is the owner's
      # Windows playtest, and it is named as such in the release notes.
      - name: The binary identifies itself as the release build
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          if [ "${{ matrix.name }}" = windows-cross ]; then
            echo "Checking compiled-in stamp literals in ${{ matrix.artifact }} (not executing a Windows PE here)"
            for want in "$TAG" "sdl-win" "sdl3" "static" "release"; do
              if ! grep -a -q "$want" "engine/${{ matrix.artifact }}"; then
                echo "FAIL: '$want' is not in the binary — the build stamp did not reach the compiler"
                exit 1
              fi
            done
            echo "ok: the Windows artifact carries its tag, target, SDL impl, linkage and artifact class"
          else
            info=$("engine/${{ matrix.artifact }}" --version) || { echo "FAIL: --version did not work"; exit 1; }
            echo "$info"
            case "$info" in
              *"artifact=release"*) : ;;
              *) echo "FAIL: artifact does not claim artifact=release"; exit 1 ;;
            esac
            case "$info" in
              *"$TAG"*) : ;;
              *) echo "FAIL: binary does not name the tag it was built from ($TAG)"; exit 1 ;;
            esac
            echo "ok: the Linux artifact identifies itself when asked"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: engine/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum u2-sdl-static u2-sdl.exe > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/u2-sdl-static
            dist/u2-sdl.exe
            dist/SHA256SUMS.txt
