name: asm-checksum

# THE PROOF. Rebuilds the entire binary from the cleaned asm/ tree and verifies
# it against the known md5 of the original image. This workflow is deliberately
# separate from the engine tests: a byte-exact reconstruction must never appear
# to regress because unrelated work-in-progress is failing, and a red badge here
# always means the reconstruction itself broke.
#
# The copyrighted original is deliberately NOT part of this repo or this
# workflow: the build must be byte-identical, so its checksum IS the
# verification.
#
# NOTE: the built binary is never uploaded as an artifact — that would
# redistribute the copyrighted game. The workflow only reports PASS/FAIL.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The body guard compares the tree against a BASE REF. With the default
          # fetch-depth of 1 there is no base to compare to, and the guard would either
          # pass vacuously or fail for the wrong reason. Full history is small here.
          fetch-depth: 0
      - name: Install toolchain (binutils + python3 are preinstalled)
        run: python3 --version && as --version | head -1

      # asm/ body content is the thing CP0 protects. The guard compares a working tree to
      # a ref, so on a clean checkout it MUST be given a base: comparing HEAD to HEAD can
      # only ever print "conserved", which is a gate that cannot go red. It used to be run
      # that way from `make test` and passed unconditionally in CI -- a committed, unmarked
      # body edit sailed through. See engine/tests/asm_body_guard.py.
      - name: asm/ body guard (against the merge base)
        env:
          GITHUB_PR_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          BASE=$(bash tools/ci_base.sh) || exit 2
          echo "body guard base: $BASE"
          python3 engine/tests/asm_body_guard.py --base "$BASE"

      - name: asm/ correction markers currently in force
        run: python3 engine/tests/asm_body_guard.py --list-marked

      - name: Rebuild from cleaned tree and verify checksum
        run: bash tools/assemble_clean.sh /tmp/u2-clean-rebuild.bin
      - name: Per-function spot check (sample)
        run: |
          for seg in 0100 2B8F 4FDF 363B 8DCD; do
            python3 tools/check_func.py "$seg" --no-compare
          done
