name: engine-tests

# Phase 4: the portable C engine must build with nothing but a C11 compiler, and
# its acceptance tests must pass. Separate from asm-checksum on purpose — engine
# work is in progress and must not be read as a problem with the byte-exact
# reconstruction, which has its own always-green-or-broken badge.
#
# No game content is involved. CI has no `original/ultimaii.exe`, so the string
# extractor runs in asm-fallback mode and recovers 37 of 64 strings; that is a
# supported configuration and CP1 asserts it explicitly. Anything that must be
# byte-identical to the shipped binary cannot be verified here, which is why the
# committed CP2 replay evidence is checked against the fallback build too.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine (cc only, no dependencies)
        run: make -C engine
      - name: Acceptance tests (CP0..CP4)
        run: make -C engine test

      # Mutation harnesses. `make test` proves the models agree with their controls; these
      # prove the tests can still go RED, which is the half that rots silently: a table test
      # whose clauses were all deleted still passes. A control nobody runs has already
      # failed — both of these exited 0 while printing FAIL, and mutate_stepgate.sh cd'd into
      # a hardcoded absolute path that does not exist on a runner, so on CI it checked nothing
      # and reported PASS. Fixed, and now enforced here rather than by someone remembering.
      # They need the build tree `make -C engine` just produced.
      - name: Speed model mutations (prove speed_check can fail)
        run: bash engine/tests/mutate_speed.sh
      - name: Step gate mutations (prove ai_check can fail)
        run: bash tools/mutate_stepgate.sh
