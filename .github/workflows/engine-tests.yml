name: engine-tests

# Phase 4: the portable C engine must build with nothing but a C11 compiler, and
# its acceptance tests must pass. Separate from asm-checksum on purpose — engine
# work is in progress and must not be read as a problem with the byte-exact
# reconstruction, which has its own always-green-or-broken badge.
#
# The engine's strings come from `engine/content/gen_content.h`, which is
# generated from the owner's copy of the game and committed precisely so that a
# runner without `original/ultimaii.exe` still builds a complete game. The asm
# fallback resolves 181 of 220 strings and blanks the other 38, so it is no
# longer a build source; it is the verifier. `content-check` below proves the
# committed text still agrees with the byte-proven asm/ tree for every string
# asm can reach, and that no committed string is empty. Anything that must be
# byte-identical to the shipped binary still cannot be verified here, which is
# why the committed CP2 replay evidence is checked against this build too.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Content header agrees with the asm tree (drift gate)
        run: make -C engine content-check
      - name: Build engine (cc only, no dependencies)
        run: make -C engine
      - name: Acceptance tests (CP0..CP4)
        run: make -C engine test

      # The command-loop ruling (AGENTS.md § 3): twelve handlers have never executed in a
      # capture, each must carry an UNPROVEN marker, and no checkpoint may be called
      # code-complete while one stands. Runs in both workflows -- here because it guards engine
      # source, in gate-suite because it guards the state document's claims.
      - name: Command marker gate
        run: python3 tools/cmd_marker_gate.py --selftest && python3 tools/cmd_marker_gate.py

      # Mutation harnesses. `make test` proves the models agree with their controls; these
      # prove the tests can still go RED, which is the half that rots silently: a table test
      # whose clauses were all deleted still passes. A control nobody runs has already
      # failed — both of these exited 0 while printing FAIL, and mutate_stepgate.sh cd'd into
      # a hardcoded absolute path that does not exist on a runner, so on CI it checked nothing
      # and reported PASS. Fixed, and now enforced here rather than by someone remembering.
      # They need the build tree `make -C engine` just produced.
      - name: Speed model mutations (prove speed_check can fail)
        run: bash engine/tests/mutate_speed.sh
      - name: Step gate mutations (prove ai_check can fail)
        run: bash tools/mutate_stepgate.sh
